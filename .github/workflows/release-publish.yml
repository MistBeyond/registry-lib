name: Release to Maven Central

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-central-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify release tag matches mod_version
        if: github.event_name == 'release'
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match mod_version=${version}"
            exit 1
          fi

      - name: Build and stage Maven bundle
        env:
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          MAVEN_CENTRAL_SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: |
          rm -rf build/central-bundle
          ./gradlew --no-daemon build publishMavenJavaPublicationToCentralBundleRepository

      - name: Upload bundle to Central Portal
        id: upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          cd build/central-bundle
          zip -qr ../central-portal-bundle.zip .
          cd ../..
          response="$(curl -sS -u "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" \
            -X POST \
            -F "bundle=@build/central-portal-bundle.zip" \
            https://central.sonatype.com/api/v1/publisher/upload)"
          deployment_id="$(printf '%s' "$response" | jq -r '.deploymentId // .deployment_id // .id // empty')"
          if [ -z "${deployment_id}" ]; then
            echo "::error::Central Portal upload failed: ${response}"
            exit 1
          fi
          echo "deployment_id=${deployment_id}" >> "${GITHUB_OUTPUT}"
          echo "Created deployment ${deployment_id}"

      - name: Publish deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          curl -sS -u "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" \
            -X POST \
            "https://central.sonatype.com/api/v1/publisher/deployment/${{ steps.upload.outputs.deployment_id }}/publish"

      - name: Wait for deployment to be published
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          deployment_id="${{ steps.upload.outputs.deployment_id }}"
          for attempt in $(seq 1 60); do
            status="$(curl -sS -u "${MAVEN_CENTRAL_USERNAME}:${MAVEN_CENTRAL_PASSWORD}" \
              "https://central.sonatype.com/api/v1/publisher/deployment/${deployment_id}/status")"
            state="$(printf '%s' "$status" | jq -r '.deploymentState // .state // .status // empty')"
            echo "Deployment state: ${state}"
            case "${state}" in
              PUBLISHED) exit 0 ;;
              VALIDATION_FAILED|FAILED|ERROR)
                echo "::error::Central Portal deployment failed: ${status}"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Deployment ${deployment_id} did not reach PUBLISHED in time"
          exit 1
